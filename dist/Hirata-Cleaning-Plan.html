<!DOCTYPE html>
<html lang="en" data-theme="white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hirata Cleaning Plan</title>
  <style>
/* Hirata Cleaning Plan - styles. Two themes: Pure White (default) and Dark Teal. */

:root, [data-theme="white"] {
  --ats-blue: #0057a8;   /* AT&S blue - change here if the brand guide gives another code */
  --bg: #f2f6fa; --surface: #ffffff; --surface-2: #eef3f8; --text: #1b2733; --muted: #5f6f82; --line: #dce4ee;
  --brand: var(--ats-blue); --brand-2: #0a63c2; --on-brand: #ffffff; --focus: #1a7cf5;
  --upcoming-bg: #eef2f6; --upcoming-fg: #3e4c59;
  --today-bg: #e2f0fb; --today-fg: #0b5394;
  --overdue-bg: #fde4e4; --overdue-fg: #a61b1b;
  --postponed-bg: #fff1d6; --postponed-fg: #8a5300;
  --done-bg: #dff3e6; --done-fg: #17663a;
  --down-bg: #2f3a45; --down-fg: #ffffff;
  --projected-fg: #9aa5b1;
  --today-col: #eaf3ff;
  --danger: #c0392b;
  --shadow: 0 8px 30px rgba(15, 35, 50, .18);
  --c-upcoming: var(--ats-blue); --c-today: #1565d8; --c-overdue: #c62828; --c-postponed: #e8900c; --c-done: #1e9e57; --c-down: #3a4552; --c-projected: #8fb2da; --c-skipped: #9aa7b5;
  --card-shadow: 0 1px 2px rgba(16, 40, 56, .06), 0 4px 16px rgba(16, 40, 56, .06);
  --page-glow: radial-gradient(1200px 400px at 10% -10%, rgba(19, 100, 118, .10), transparent 60%), radial-gradient(900px 400px at 100% 0%, rgba(23, 105, 224, .07), transparent 60%);
}

[data-theme="teal"] {   /* "Dark" theme: graphite grey with AT&S blue (key kept as "teal" for saved settings) */
  --bg: #14171c; --surface: #1d2229; --surface-2: #262c35; --text: #e9edf2; --muted: #9ca8b7; --line: #333b46;
  --brand: #0b4f96; --brand-2: #2f7ff0; --on-brand: #ffffff; --focus: #6aa8ff;
  --upcoming-bg: #1d3452; --upcoming-fg: #cfe3ff;
  --today-bg: #1f4f8f; --today-fg: #dbeaff;
  --overdue-bg: #4a1d1d; --overdue-fg: #ffb4ab;
  --postponed-bg: #4a3612; --postponed-fg: #ffd591;
  --done-bg: #173d2a; --done-fg: #9fe8bf;
  --down-bg: #000000; --down-fg: #ffffff;
  --projected-fg: #7f97b3;
  --today-col: #1b2a3d;
  --danger: #ff6b5e;
  --shadow: 0 8px 30px rgba(0, 0, 0, .55);
  --c-upcoming: #5ea2ff; --c-today: #2563eb; --c-overdue: #dc2626; --c-postponed: #f2a33a; --c-done: #34c77b; --c-down: #8a96a3; --c-projected: #6f8db0; --c-skipped: #6b7785;
  --card-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .3);
  --page-glow: radial-gradient(1200px 400px at 10% -10%, rgba(47, 127, 240, .10), transparent 60%);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, Arial, sans-serif; }
body { background-image: var(--page-glow); background-attachment: fixed; min-height: 100vh; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Top bar */
.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  background: linear-gradient(90deg, var(--brand), color-mix(in srgb, var(--brand) 65%, #1a7cf5)); color: var(--on-brand); padding: 10px 24px;
  box-shadow: 0 2px 12px rgba(0, 0, 0, .15); }
.brand { font-size: 17px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 10px; }
.logo { display: inline-flex; width: 34px; height: 34px; border-radius: 9px; align-items: center; justify-content: center; background: rgba(255,255,255,.12); }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-sub { font-size: 11px; font-weight: 400; opacity: .65; letter-spacing: .02em; }
.icon { flex: none; vertical-align: -2px; }
.btn, .theme-btn, .toast-action { display: inline-flex; align-items: center; gap: 6px; }
.btn.square { padding: 8px; }
.theme-btn { background: rgba(255,255,255,.1); color: var(--on-brand); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.theme-btn:hover { background: rgba(255,255,255,.18); }
.modal-head .icon-btn svg { transform: rotate(45deg); }
.version { font-size: 11px; opacity: .6; font-weight: 400; }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.nav { display: flex; gap: 4px; }
.nav a { padding: 6px 12px; border-radius: 6px; text-decoration: none; opacity: .85; }
.nav a:hover { background: rgba(255,255,255,.12); opacity: 1; }
.nav a.active { background: rgba(255,255,255,.18); opacity: 1; font-weight: 600; }
.admin-chip { font-size: 13px; background: rgba(255,255,255,.14); padding: 4px 10px; border-radius: 999px; display: flex; gap: 8px; align-items: center; }
.link { background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0; color: inherit; }

main { padding: 20px 24px 60px; max-width: 1400px; margin: 0 auto; }
h2 { font-size: 20px; margin: 0 0 14px; }
h3 { font-size: 16px; margin: 4px 0 12px; }
.muted { color: var(--muted); }

/* Buttons */
.btn { background: var(--brand-2); color: #fff; border: 1px solid transparent; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
.btn:hover:not(:disabled) { filter: brightness(1.1); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.secondary { background: var(--postponed-bg); color: var(--postponed-fg); }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); font-weight: 500; }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); filter: none; }
.btn.on-dark { color: var(--on-brand); border-color: rgba(255,255,255,.35); }
.btn.on-dark:hover { background: rgba(255,255,255,.12) !important; }
.btn.danger { background: var(--danger); }
.btn.danger-text { color: var(--danger); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.big { padding: 12px 22px; font-size: 15px; }
.icon-btn { background: none; border: 0; font-size: 20px; cursor: pointer; color: var(--text); line-height: 1; padding: 4px 8px; border-radius: 6px; }
.icon-btn.on-dark { color: var(--on-brand); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

/* Board */
.board-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
.week-nav { display: flex; align-items: center; gap: 8px; }
.week-title { min-width: 280px; text-align: center; margin: 0 4px; }
.week-kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.week-label { margin: 0; font-size: 21px; }
.week-label .wk { color: var(--brand-2); }
.week-label .sep { color: var(--muted); font-weight: 400; }
.bar-right { display: flex; align-items: center; gap: 14px; }

/* Summary strip */
.summary { display: grid; grid-template-columns: 1.6fr repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
.progress-card, .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.progress-card { display: flex; align-items: center; gap: 14px; }
.ring { --p: 0; width: 58px; height: 58px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: conic-gradient(var(--done-fg) calc(var(--p) * 1%), var(--surface-2) 0); }
.ring span { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.progress-text { font-size: 15px; font-weight: 600; }
.tile { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto auto; column-gap: 10px; text-align: left; cursor: pointer; color: var(--text);
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; position: relative; overflow: hidden; }
.tile::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--tile-accent, var(--line)); }
.tile:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.08); }
.tile.on { border-color: var(--tile-accent); box-shadow: 0 0 0 2px var(--tile-accent) inset; }
.tile-ico { grid-row: 1 / 4; align-self: center; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--tile-bg, var(--surface-2)); color: var(--tile-accent, var(--muted)); }
.tile-num { font-size: 24px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.tile-sub { font-size: 12px; color: var(--muted); }
.tile.zero .tile-num { color: var(--muted); }
.t-today { --tile-accent: var(--today-fg); --tile-bg: var(--today-bg); }
.t-overdue { --tile-accent: var(--overdue-fg); --tile-bg: var(--overdue-bg); }
.t-overdue:not(.zero) .tile-num { color: var(--overdue-fg); }
.t-postponed { --tile-accent: var(--postponed-fg); --tile-bg: var(--postponed-bg); }
.t-done { --tile-accent: var(--done-fg); --tile-bg: var(--done-bg); }
.t-down { --tile-accent: var(--danger); --tile-bg: var(--overdue-bg); }
@media (max-width: 1100px) { .summary { grid-template-columns: repeat(3, 1fr); } }

/* Highlight one status: dim the rest */
.grid.focus .chip { opacity: .22; }
.grid.focus-today .chip.s-today, .grid.focus-overdue .chip.s-overdue, .grid.focus-postponed .chip.s-postponed,
.grid.focus-done .chip.s-done, .grid.focus-down .chip.s-down { opacity: 1; box-shadow: 0 0 0 2px currentColor; }
.grid.focus-down tr:not(.is-down) .tool-col { opacity: .4; }
.toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--muted); }
.grid-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; }
.grid th, .grid td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 8px; vertical-align: top; }
.grid th:last-child, .grid td:last-child { border-right: 0; }
.grid thead th { background: var(--surface-2); font-weight: 600; text-align: left; position: sticky; top: 0; white-space: nowrap; }
.grid thead th.is-today { background: var(--today-bg); color: var(--today-fg); box-shadow: inset 0 -3px 0 var(--today-fg); }
.grid td.is-today { background: var(--today-col); }
.grid thead th.is-past .dnum, .grid thead th.is-past .dname { opacity: .6; }
.today-pill { margin-left: 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; background: var(--today-fg); color: var(--surface); padding: 2px 7px; border-radius: 999px; vertical-align: 1px; }
.grid tbody tr:hover td, .grid tbody tr:hover th { background-color: color-mix(in srgb, var(--surface-2) 70%, transparent); }
.grid tbody tr:hover td.is-today { background: var(--today-col); }
.grid .tool-col { position: sticky; left: 0; background: var(--surface); z-index: 1; }
.grid thead .tool-col { background: var(--surface-2); z-index: 2; }
.tool-line { display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot-ok { background: var(--done-fg); }
.dot-down { background: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 25%, transparent); }
tr.is-down .tool-col { box-shadow: inset 4px 0 0 var(--danger); }
.grid td { width: 17%; min-width: 130px; height: 52px; }
.dname { color: var(--muted); font-weight: 500; }
.tool-col { width: 15%; min-width: 150px; text-align: left; }
.tool-name { background: none; border: 0; padding: 0; font-weight: 700; font-size: 15px; cursor: pointer; color: var(--text); }
.tool-name:hover { text-decoration: underline; }
.sched { color: var(--muted); font-size: 12px; font-weight: 400; }
tr.is-down .tool-name { color: var(--muted); }
.badge { display: inline-block; margin-left: 6px; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; vertical-align: middle; }
.badge.down { background: var(--down-bg); color: var(--down-fg); }
.empty { text-align: center; color: var(--muted); padding: 30px !important; }

.chip { display: flex; align-items: center; gap: 8px; width: 100%; margin: 2px 0; padding: 7px 9px; border-radius: 8px; border: 1px solid transparent;
  font-size: 13px; font-weight: 600; text-align: left; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease, opacity .2s ease; }
button.chip:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,.12); border-color: currentColor; }
.chip-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.chip-main { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip-sub { font-size: 11px; font-weight: 500; opacity: .85; }
.chip.s-overdue { box-shadow: inset 3px 0 0 var(--overdue-fg); }
.chip.s-today { box-shadow: inset 3px 0 0 var(--today-fg); }
.chip.s-done { opacity: .9; }
.empty .icon { color: var(--muted); margin-bottom: 6px; }
.chip.static { display: inline-flex; width: auto; cursor: default; margin: 0 6px 6px 0; }
.chip.static:hover { filter: none; border-color: transparent; }
.chip .ico { width: 14px; text-align: center; }
.chip .tag { margin-left: auto; font-size: 11px; font-weight: 500; opacity: .8; }
.s-upcoming { background: var(--upcoming-bg); color: var(--upcoming-fg); }
.s-today { background: var(--today-bg); color: var(--today-fg); }
.s-overdue { background: var(--overdue-bg); color: var(--overdue-fg); }
.s-postponed { background: var(--postponed-bg); color: var(--postponed-fg); }
.s-done { background: var(--done-bg); color: var(--done-fg); }
.s-down { background: var(--down-bg); color: var(--down-fg); }
.s-projected { background: transparent; color: var(--projected-fg); border: 1px dashed var(--line); font-weight: 500; cursor: default; padding-top: 5px; padding-bottom: 5px; }
span.chip.s-projected:hover { filter: none; border-color: var(--line); }
.legend { margin-top: 12px; display: flex; flex-wrap: wrap; }
.legend .chip { font-size: 12px; padding: 4px 9px; }

/* Lists (history, settings) */
.list th, .list td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.list thead th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
.list tbody tr:hover { background: var(--surface-2); }
.list .wrap { white-space: normal; max-width: 420px; }
.strong { font-weight: 600; }
.mono { font-family: Consolas, "Courier New", monospace; }
tr.is-archived { opacity: .55; }
.row-actions { white-space: nowrap; text-align: right; }
.row-actions .btn { margin-left: 4px; }
.act { font-weight: 600; }
.a-completed { color: var(--done-fg); } .a-postponed { color: var(--postponed-fg); } .a-tool_down { color: var(--danger); }
.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 10px; }
.filter-actions { display: flex; gap: 8px; }
.row-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }

/* Tabs and cards */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tab { background: none; border: 0; padding: 8px 14px; cursor: pointer; border-bottom: 3px solid transparent; color: var(--muted); font-weight: 600; }
.tab.active { color: var(--text); border-bottom-color: var(--brand-2); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; max-width: 760px; }
.center-card { max-width: 520px; margin: 60px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field .label { font-weight: 600; font-size: 13px; }
.field .hint, .hint { color: var(--muted); font-size: 12px; }
input[type=text], input[type=password], input[type=date], input[type=number], input[type=url], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; }
input.num { width: 90px; }
input.wide { width: 100%; }
textarea { width: 100%; resize: vertical; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0 16px; }
.form-error { color: var(--danger); font-weight: 600; margin: 6px 0; }
.person { min-width: 260px; font-size: 15px; padding: 9px 10px; }
.preview { background: var(--surface-2); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
.preview.bad { color: var(--danger); }
.confirm-q { font-size: 15px; font-weight: 600; }

/* Modal */
.backdrop { position: fixed; inset: 0; background: rgba(10, 20, 28, .45); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; z-index: 50; overflow-y: auto; animation: fade-in .15s ease; }
.modal { background: var(--surface); color: var(--text); border-radius: 14px; box-shadow: var(--shadow); width: 100%; max-width: 520px; animation: pop-in .18s ease; }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
.modal.wide { max-width: 760px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-head h2 { margin: 0; font-size: 17px; }
.modal-body { padding: 16px 18px 18px; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0 0 12px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; }
.events { margin: 6px 0 10px; font-size: 13px; }
.events summary { cursor: pointer; color: var(--muted); }
.events ul { margin: 6px 0 0; padding-left: 18px; }
.action-area { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 8px; }

/* Toasts */
.toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px; background: var(--surface); color: var(--text); border: 1px solid var(--line);
  border-left: 4px solid var(--done-fg); padding: 11px 14px; border-radius: 10px; box-shadow: var(--shadow); font-weight: 600; max-width: 460px;
  transition: opacity .4s, transform .4s; animation: slide-in .2s ease; }
.toast.error { border-left-color: var(--overdue-fg); color: var(--overdue-fg); }
.toast.fade { opacity: 0; transform: translateX(20px); }
.toast-action { margin-left: auto; background: var(--brand-2); color: #fff; border: 0; border-radius: 6px; padding: 5px 10px; font-weight: 700; cursor: pointer; }
.toast-bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--brand-2); transform-origin: left; animation: shrink linear forwards; }
@keyframes slide-in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
@keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

@media print {
  @page { size: A4 landscape; margin: 10mm; }
  html, body { background: #fff; color: #000; }
  .topbar, .board-bar .btn, .bar-right, .toasts, .summary .tile { display: none !important; }
  .summary { display: block; margin: 0 0 6px; }
  .progress-card { border: 0; padding: 0; }
  .ring { display: none; }
  main { padding: 0; max-width: none; }
  .grid-wrap { border: 1px solid #999; overflow: visible; }
  .grid th, .grid td { border-color: #bbb !important; }
  .chip { box-shadow: none !important; border: 1px solid #888 !important; transform: none !important; }
  .grid .tool-col { position: static; }
  .week-kicker { display: none; }
}


/* ---------- v0.4 look: status medallions, card chips, tool badges ---------- */
.med { display: inline-grid; place-items: center; flex: none; border-radius: 50%; color: #fff; background: var(--c, var(--c-upcoming));
  box-shadow: 0 1px 2px rgba(0,0,0,.18), inset 0 -2px 0 rgba(0,0,0,.12); }
.med .icon { stroke-width: 2.4; }
.m-upcoming { --c: var(--c-upcoming); }
.m-today { --c: var(--c-today); animation: ring-today 2.4s ease-out infinite; }
.m-overdue { --c: var(--c-overdue); animation: ring-overdue 1.8s ease-out infinite; }
.m-postponed { --c: var(--c-postponed); }
.m-done { --c: var(--c-done); }
.m-down { --c: var(--c-down); clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); border-radius: 0; box-shadow: none; }
.m-projected { background: transparent; color: var(--c-projected); box-shadow: inset 0 0 0 1.5px var(--c-projected); }
.m-projected .icon { stroke-width: 2; }
@keyframes ring-overdue { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c-overdue) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
@keyframes ring-today { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c-today) 45%, transparent); } 70%, 100% { box-shadow: 0 0 0 6px transparent; } }

/* chips become small cards */

/* js/config.js */
/** Hirata Cleaning Plan - config.js: names and constants used everywhere. */
window.HCP = window.HCP || {};
window.HCP.config = {
  app_name: 'Hirata Cleaning Plan',
  version: '0.10.0',
  idb_name: 'hirata-cleaning-plan',   // remembers the data folder per PC

  <script>
/* js/rules.js */
/**
 * Hirata Cleaning Plan - rules.js
 *
 * ALL date, schedule and status logic (PLAN.md section 6, R1-R16).
 * Pure functions: no file access, no DOM. Dates are 'YYYY-MM-DD' strings
 * (local Europe/Vienna date); weekday numbers: 1 = Monday ... 7 = Sunday.
 */
window.HCP = window.HCP || {};
window.HCP.rules = (function () {
  'use strict';

  var DAY_NAMES = ['', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  /* --- Date helpers ------------------------------------------------- */

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function parse(d) { var p = d.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
  function fmt(dt) { return dt.getUTCFullYear() + '-' + pad(dt.getUTCMonth() + 1) + '-' + pad(dt.getUTCDate()); }
  function isDate(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && fmt(parse(s)) === s; }
  function addDays(d, n) { var x = parse(d); x.setUTCDate(x.getUTCDate() + n); return fmt(x); }
  function weekday(d) { var w = parse(d).getUTCDay(); return w === 0 ? 7 : w; }
  function isWeekend(d) { return weekday(d) > 5; }
  /** Weekend -> following Monday; working days unchanged. */
  function toWorkingDay(d) { var w = weekday(d); return w === 6 ? addDays(d, 2) : w === 7 ? addDays(d, 1) : d; }
  /** First working day strictly after d. */
  function nextWorkingDay(d) { return toWorkingDay(addDays(d, 1)); }
  /** Weekend -> previous Friday (used to place a weekend completion in the grid). */
  function toPrevWorkingDay(d) { var w = weekday(d); return w === 6 ? addDays(d, -1) : w === 7 ? addDays(d, -2) : d; }
  function mondayOf(d) { return addDays(d, 1 - weekday(d)); }
  function daysInMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }   // m: 1-12
  /** Day `day` of month m (m may run past 12), clamped to the month's last day. */
  function monthDate(y, m, day) {
    y += Math.floor((m - 1) / 12);
    m = ((m - 1) % 12 + 12) % 12 + 1;
    return y + '-' + pad(m) + '-' + pad(Math.min(day, daysInMonth(y, m)));
  }

  function diffDays(a, b) { return Math.round((parse(b) - parse(a)) / 864e5); }   // b - a in days

  /** Today's local date (R16). config.fixed_today overrides it (tests). */
  function today() {
    var c = window.HCP.config;
    if (c && c.fixed_today) return c.fixed_today;
    var n = new Date();
    return n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate());

  /** ISO week number (for "Week 47"). */
  function isoWeek(d) {
    var x = parse(d);
    x.setUTCDate(x.getUTCDate() + 4 - (x.getUTCDay() || 7));

    return Math.ceil(((x - yearStart) / 864e5 + 1) / 7);

/* js/adapters/storage-folder.js */
/**
 * Hirata Cleaning Plan - adapters/storage-folder.js
 *
 * Storage adapter for today: a folder the person picks (data\ next to
 * index.html), through the File System Access API (Edge/Chrome). The folder
 * handle is kept in IndexedDB so later visits need one click.
 *
 * Every storage adapter has the same interface, all Promise-based, so the
 * store can swap this one for a server API later without other changes:
 *
 *   id                      'folder'
 *   isSupported()           true when this browser can use it
 *   unsupportedMessage()    what to tell the person otherwise
 *   hasSaved()              -> bool   a connection is remembered
 *   connect()               -> void   first use (asks the person)
 *   reconnect({silent})     -> bool   later visits (false = ask again). silent:
 *                                     never prompt - a browser prompt needs a click
 *   savedLabel()            -> name of the remembered connection, or null
 *   label()                 name to show (the folder name)
 *   read(path)              -> text | null (null = no such file)
 *   write(path, text)       -> void
 *   list(dir)               -> [{name, size}]  files in a sub-folder
 *   remove(path)            -> void
 *
 * Paths are relative, '/'-separated: 'hirata_data.json', 'backups/x.json'.
 * Only the store calls this module.
 */
window.HCP = window.HCP || {};
window.HCP.adapters = window.HCP.adapters || {};
window.HCP.adapters.storageFolder = (function () {
  'use strict';

  var cfg = window.HCP.config;
  var IDB_STORE = 'handles';
  var IDB_KEY = 'data-folder';
  var dir = null;   // FileSystemDirectoryHandle once connected

  function isSupported() { return typeof window.showDirectoryPicker === 'function'; }

  function unsupportedMessage() {
    return 'This app needs the File System Access API. Please open it in Microsoft Edge or Google Chrome.';
  }

  /* --- IndexedDB: remember the folder handle ------------------------ */

  function idb() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(cfg.idb_name, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function idbPut(value) {
    return idb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(value, IDB_KEY);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function idbGet() {
    return idb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, 'readonly');
        var req = tx.objectStore(IDB_STORE).get(IDB_KEY);
        req.onsuccess = function () { resolve(req.result || null); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }

  /* --- Connecting --------------------------------------------------- */

  function hasSaved() {
    return idbGet().then(function (h) { return !!h; }).catch(function () { return false; });
  }

  function connect() {
    return window.showDirectoryPicker({ id: 'hcp-data', mode: 'readwrite' }).then(function (handle) {
      dir = handle;
      return idbPut(handle).catch(function () { /* still usable this session */ });
    });
  }

  function reconnect(o) {
    var silent = !!(o && o.silent);
    return idbGet().then(function (handle) {
      if (!handle) return false;
      return handle.queryPermission({ mode: 'readwrite' }).then(function (perm) {
        if (perm === 'granted' || silent) return perm;
        return handle.requestPermission({ mode: 'readwrite' });   // needs a click
      }).then(function (perm) {
        if (perm !== 'granted') return false;
        dir = handle;
        return true;
      });
    });
  }

  function savedLabel() {
    return idbGet().then(function (h) { return h && h.name ? h.name : null; }).catch(function () { return null; });
  }

  function label() { return dir && dir.name ? dir.name : null; }

  /* --- Files -------------------------------------------------------- */

  function need() {
    if (!dir) throw new Error('No data folder is connected');
    return dir;
  }

  /** Resolve 'a/b/file.json' to [folder handle, 'file.json']. */
  function locate(path, create) {
    var parts = String(path).split('/').filter(Boolean);
    var name = parts.pop();
    var p = Promise.resolve(need());
    parts.forEach(function (sub) {
      p = p.then(function (d) { return d.getDirectoryHandle(sub, { create: !!create }); });
    });
    return p.then(function (d) { return [d, name]; });
  }

  function read(path) {
    return locate(path, false)
      .then(function (loc) { return loc[0].getFileHandle(loc[1]); })
      .then(function (fh) { return fh.getFile(); })
      .then(function (file) { return file.text(); })
      .catch(function (e) {
        if (e && (e.name === 'NotFoundError' || e.name === 'TypeMismatchError')) return null;
        throw e;
      });
  }

  function write(path, text) {
    return locate(path, true)
      .then(function (loc) { return loc[0].getFileHandle(loc[1], { create: true }); })
      .then(function (fh) { return fh.createWritable(); })
      .then(function (w) { return w.write(text).then(function () { return w.close(); }); });
  }

  function list(sub) {
    return need().getDirectoryHandle(sub, { create: true }).then(function (d) {
      return (async function () {
        var out = [];
        for await (var entry of d.values()) {
          if (entry.kind !== 'file') continue;
          var file = await entry.getFile();
          out.push({ name: entry.name, size: file.size });
        }
        return out;
      })();
    });
  }

  function remove(path) {
    return locate(path, false).then(function (loc) { return loc[0].removeEntry(loc[1]); });
  }

  return {
    id: 'folder',
    isSupported: isSupported,
    unsupportedMessage: unsupportedMessage,
    hasSaved: hasSaved,
    connect: connect,
    reconnect: reconnect,
    savedLabel: savedLabel,
    label: label,
    read: read,
    write: write,
    list: list,
    remove: remove
  };
})();

  /* --- Small helpers ------------------------------------------------ */

  function err(code, msg) { var e = new Error(msg); e.code = code; return e; }
  function newId(p) { return p + '_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  function clean(s) { return s == null ? '' : String(s).trim(); }
  function find(list, id) { return list.find(function (x) { return x.id === id; }) || null; }
  function nowStamp() {
    if (cfg.fixed_today) return cfg.fixed_today + 'T12:00:00';
    var n = new Date(), p = R.pad;
    return R.today() + 'T' + p(n.getHours()) + ':' + p(n.getMinutes()) + ':' + p(n.getSeconds());
  }

  function setAdapter(a) { adapter = a; }
  function current() { return data; }
  function wasRecovered() { return recovered; }

  /** Find a person by user id (what the name list sends) or by short ID. */
  function findUser(d, ref) {
    var key = clean(ref).toUpperCase();
    if (!key) return null;
    return d.users.find(function (x) { return x.id === clean(ref); }) ||
      d.users.find(function (x) { return x.operator_id.toUpperCase() === key; }) || null;
  }

  function userByOperatorId(d, ref) {
    if (!clean(ref)) throw err('noid', 'Choose your name.');
    var u = findUser(d, ref);
    if (!u) throw err('badid', 'This person is not in the list any more. The board will refresh.');
    if (!u.active) throw err('badid', u.name + ' is deactivated.');
    return u;
  }

  /** Lookup for screens (no error). */
  function lookupOperator(ref) {
    if (!data) return null;
    var u = findUser(data, ref);
    return u && u.active ? u : null;
  }

  /** Active people for the name list, sorted by name. */
  function activeUsers() {
    if (!data) return [];
    return data.users.filter(function (u) { return u.active; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
  }
  function admins() { return activeUsers().filter(function (u) { return u.role === 'admin'; }); }

  /** Next free short ID like OP003 (people never need to type it). */
  function nextShortId(d) {
    var n = 1;
    while (d.users.some(function (u) { return u.operator_id === 'OP' + (n < 10 ? '00' : n < 100 ? '0' : '') + n; })) n++;
    return 'OP' + (n < 10 ? '00' : n < 100 ? '0' : '') + n;
  }

  function requireAdmin(d) {
    var u = admin && find(d.users, admin.user_id);
    if (!u || !u.active || u.role !== 'admin') {
      admin = null;
      throw err('forbidden', 'Only an Admin can do this. Please log in as Admin.');
    }
    return u;
  }

  function hist(d, row) {
    d.history.push({
      id: newId('h'), tool_id: row.tool_id || null, task_id: row.task_id || null, magazine_id: row.magazine_id || null, action: row.action,
      user_id: row.user_id || null, at: nowStamp(), reason: clean(row.reason), comment: clean(row.comment),
      old_date: row.old_date || null, new_date: row.new_date || null
    });
  }

  function makeTask(toolId, r, oneOff) {
    return {
      id: newId('task'), tool_id: toolId, task_type: 'cleaning',
      pattern_date: r.pattern, nominal_date: r.nominal || r.pattern, due_date: r.pattern,
      status: 'open', is_one_off: oneOff ? 1 : 0, postpone_count: 0, last_postpone_reason: '',
      completed_by: null, completed_at: null, completion_comment: '', generated_from: null
    };
  }

  function openScheduled(d, toolId) {
    return d.tasks.find(function (t) { return t.tool_id === toolId && t.status === 'open' && !t.is_one_off; }) || null;
  }

  /** First scheduled task date for a tool: first rule date on or after its start date,
   *  stepped forward along the pattern so it is never in the past. */
  function firstFrom(tool) {
    var r = R.firstRuleDate(tool, tool.start_date);
    var today = R.today();
    for (var i = 0; i < 2000 && r.pattern < today; i++) r = R.stepRule(tool, r.nominal);
    return r;
  }

  function pmToolFromSeed(s) {
    var tool = {
      id: newId('tool'), kind: 'pm', pos: SEED_PM.indexOf(s), name: s[0], tool_owner: '', mnt_owner: s[1],
      schedule_type: s[2] ? 'weeks' : 'none', interval: s[2] || null, weekday: s[3] ? R.weekday(s[3]) : null, month_day: null,
      start_date: s[3], status: s[4] === 'planned' ? 'planned' : s[4] === 'down' ? 'down' : 'active',
      down_reason: '', down_since: null, down_from: null, down_until: null, archived: false
    };
    if (tool.status === 'down') { tool.down_from = SEED_PM_DOWN_FROM; tool.down_since = SEED_PM_DOWN_FROM + 'T00:00:00'; }
    return tool;
  }

  /** Adds the PM tools from the Excel that are not in the plan yet (by name). -> names added */
  function seedPm(d) {
    var added = [];
    SEED_PM.forEach(function (s) {
      if (d.tools.some(function (t) { return R.isPm(t) && t.name.toUpperCase() === s[0]; })) return;
      var tool = pmToolFromSeed(s);
      d.tools.push(tool);
      if (R.hasSchedule(tool)) d.tasks.push(makeTask(tool.id, firstFrom(tool)));
      added.push(tool.name);
    });
    return added;
  }

  /** R2/R4: create the next scheduled task unless one is already open. */
  function ensureNext(d, tool, prev, completionDate) {
    if (openScheduled(d, tool.id)) return null;
    var r = R.nextAfterCompletion(tool, prev, completionDate, d.exceptions);
    var n = makeTask(tool.id, r);
    n.due_date = r.due;
    n.generated_from = prev.id;
    if (r.used.length) {
      n.used_exceptions = (d.exceptions || []).filter(function (e) { return r.used.indexOf(e.id) >= 0; });
      d.exceptions = (d.exceptions || []).filter(function (e) { return r.used.indexOf(e.id) < 0; });
    }
    d.tasks.push(n);
    return n;
  }

  /** Remove a generated task and give back the cycle exceptions it used. */
  function removeGenerated(d, task) {
    d.tasks.splice(d.tasks.indexOf(task), 1);
    if (task.used_exceptions && task.used_exceptions.length) d.exceptions = (d.exceptions || []).concat(task.used_exceptions);
  }

  /* --- PIN hashing (PBKDF2, browser Web Crypto) ---------------------- */

  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return (b < 16 ? '0' : '') + b.toString(16); }).join(''); }
  function unhex(s) { var a = new Uint8Array(s.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(s.substr(i * 2, 2), 16); return a; }

  function derive(pin, salt, iter) {
    var subtle = window.crypto.subtle;
    return subtle.importKey('raw', new TextEncoder().encode(String(pin)), 'PBKDF2', false, ['deriveBits'])
      .then(function (key) { return subtle.deriveBits({ name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' }, key, 256); })
      .then(hex);
  }

  function hashPin(pin) {
    if (!/^\d{4,8}$/.test(String(pin || ''))) return Promise.reject(err('badpin', 'The PIN must be 4 to 8 digits.'));
    var salt = window.crypto.getRandomValues(new Uint8Array(16));
    return derive(pin, salt, 100000).then(function (h) { return 'pbkdf2$100000$' + hex(salt) + '$' + h; });
  }

  function verifyPin(pin, stored) {
    if (!stored) return Promise.resolve(false);
    var p = stored.split('$');
    return derive(pin, unhex(p[2]), +p[1]).then(function (h) { return h === p[3]; });
  }

  /* --- Load and save (R17) ------------------------------------------ */

  function parseFile(text) {
    var d = JSON.parse(text);
    if (!d || !Array.isArray(d.tools) || !Array.isArray(d.tasks)) throw new Error('not a plan file');
    return d;
  }

  /** -> plan data, or null when the folder has no plan yet. */
  function load() {
    recovered = false;
    return adapter.read(cfg.data_file).then(function (text) {
      if (text === null) { data = null; return null; }
      try { data = parseFile(text); return data; }
      catch (e) {
        return adapter.read(cfg.prev_file).then(function (prev) {
          if (prev === null) throw err('corrupt', 'The plan file is damaged and there is no backup copy.');
          data = parseFile(prev);
          recovered = true;
          return data;
        });
      }
    });
  }

  /** Run fn(freshData) and save. fn may throw to cancel. Serialized per tab. */
  function mutate(fn, who) {
    var job = queue.then(function () {
      return adapter.read(cfg.data_file).then(function (text) {
        var fresh, oldText = text;
        if (text === null) throw err('nofile', 'The plan file is missing. Reload the page.');
        try { fresh = parseFile(text); }
        catch (e) {
          // live file torn: rebuild from the backup copy
          return adapter.read(cfg.prev_file).then(function (prev) {
            if (prev === null) throw err('corrupt', 'The plan file is damaged. Ask the Admin to restore a backup.');
            return finish(parseFile(prev), prev);
          });
        }
        return finish(fresh, oldText);

        function finish(d, previousText) {
          var result = fn(d);
          d.revision = (d.revision || 0) + 1;
          d.saved_at = nowStamp();
          d.saved_by = who || null;
          return adapter.write(cfg.prev_file, previousText)
            .then(function () { return adapter.write(cfg.data_file, JSON.stringify(d, null, 1)); })
            .then(function () { data = d; return result; });
        }
      });
    });
    queue = job.catch(function () {});
    return job;
  }

  /* --- First run ---------------------------------------------------- */

  function createPlan(adminPin) {
    return adapter.read(cfg.data_file).then(function (text) {
      if (text !== null) throw err('exists', 'A plan file already exists in this folder.');
      return hashPin(adminPin);
    }).then(function (pinHash) {
      var stamp = nowStamp();
      var thisMonday = R.mondayOf(R.today());
      var d = {
        schema_version: SCHEMA_VERSION, revision: 1, created_at: stamp, saved_at: stamp, saved_by: 'ADMIN01',
        users: [{ id: newId('user'), operator_id: 'ADMIN01', name: 'Khurana', role: 'admin', pin_hash: pinHash, active: true }]
          .concat(SEED_OPERATORS.map(function (n, i) {
            return { id: newId('user'), operator_id: 'OP00' + (i + 1), name: n, role: 'operator', pin_hash: null, active: true };
          })),
        tools: [], tasks: [], history: [], exceptions: [], magazines: [], mag_events: [],
        settings: { teams_webhook_url: '', last_daily_message_date: '', theme_default: 'white', mag_check_weeks: 4 }
      };
      SEED_TOOLS.forEach(function (s) {
        var tool = {
          id: newId('tool'), name: s[0], tool_owner: s[1], mnt_owner: s[2],
          schedule_type: 'weeks', interval: s[3], weekday: s[4], month_day: null,
          start_date: R.maxDate(R.today(), R.addDays(thisMonday, 7 * s[5])), status: 'active', down_reason: '', down_since: null, archived: false
        };
        tool.start_date = R.firstRuleDate(tool, tool.start_date).pattern;   // start date = first cleaning, so each tool shows its own date
        d.tools.push(tool);
        d.tasks.push(makeTask(tool.id, R.firstRuleDate(tool, tool.start_date)));
      });
      seedPm(d);
      seedMagazines(d);
      return adapter.write(cfg.data_file, JSON.stringify(d, null, 1)).then(function () { data = d; return d; });
    });
  }

  /* --- Operator actions --------------------------------------------- */

  function openTaskOrThrow(d, taskId) {
    var t = find(d.tasks, taskId);
    if (!t) throw err('conflict', 'This cleaning no longer exists. The board will refresh.');
    if (t.status !== 'open') throw err('conflict', 'This cleaning was already completed by someone else. The board will refresh.');
    return t;
  }

  /** Who acts: PM tasks only by the logged-in Admin (13e); cleanings by the chosen person. */
  function actor(d, tool, operatorId) {
    return R.isPm(tool) ? requireAdmin(d) : userByOperatorId(d, operatorId);
  }

  /** R6 */
  function complete(taskId, operatorId, comment) {
    return mutate(function (d) {
      var t = openTaskOrThrow(d, taskId);
      var tool = find(d.tools, t.tool_id);
      var u = actor(d, tool, operatorId);
      var before = { status: t.status, completed_by: t.completed_by, completed_at: t.completed_at, completion_comment: t.completion_comment };
      t.status = 'completed';
      t.completed_by = u.id;
      t.completed_at = nowStamp();
      t.completion_comment = clean(comment);
      hist(d, { tool_id: t.tool_id, task_id: t.id, action: 'completed', user_id: u.id, comment: comment, old_date: t.due_date });
      var next = (!t.is_one_off && tool) ? ensureNext(d, tool, t, R.today()) : null;
      return { task: t, next: next, user: u,
        undo: { kind: 'complete', taskId: t.id, userId: u.id, nextId: next ? next.id : null, before: before } };
    }, clean(operatorId).toUpperCase());
  }

  /** R5. newDate and reason optional. -> {task, movedFromWeekend} */
  function postpone(taskId, operatorId, newDate, reason) {
    return mutate(function (d) {
      var t = openTaskOrThrow(d, taskId);
      var u = actor(d, find(d.tools, t.tool_id), operatorId);
      var today = R.today(), target, moved = false;
      if (clean(newDate)) {
        if (!R.isDate(newDate)) throw err('baddate', 'Enter a valid new date.');
        target = R.toWorkingDay(newDate);
        moved = target !== newDate;
        if (target < today) throw err('baddate', 'The new date cannot be in the past.');
        if (target === t.due_date) throw err('baddate', 'The new date is the same as the current date.');
      } else {
        target = R.nextWorkingDay(R.maxDate(t.due_date, today));
      }
      var old = t.due_date;
      var before = { due_date: t.due_date, postpone_count: t.postpone_count || 0, last_postpone_reason: t.last_postpone_reason || '' };
      t.due_date = target;
      t.postpone_count = (t.postpone_count || 0) + 1;
      t.last_postpone_reason = clean(reason);
      hist(d, { tool_id: t.tool_id, task_id: t.id, action: 'postponed', user_id: u.id, reason: reason, old_date: old, new_date: target });
      return { task: t, movedFromWeekend: moved, user: u,
        undo: { kind: 'postpone', taskId: t.id, userId: u.id, newDate: target, before: before } };
    }, clean(operatorId).toUpperCase());
  }

  /** Undo a Complete or Postpone right after it (the screen offers it for a few seconds).
   *  Refused if someone changed the cleaning in the meantime. */
  function undo(token) {
    return mutate(function (d) {
      var t = find(d.tasks, token.taskId);
      var changed = err('conflict', 'Cannot undo: this cleaning was changed in the meantime.');
      if (!t) throw changed;
      if (token.kind === 'complete') {
        if (t.status !== 'completed' || t.completed_by !== token.userId) throw changed;
        var next = token.nextId ? find(d.tasks, token.nextId) : null;
        if (next && (next.status !== 'open' || next.postpone_count)) throw changed;
        if (next) removeGenerated(d, next);
        Object.assign(t, token.before);
        hist(d, { tool_id: t.tool_id, task_id: t.id, action: 'undone', user_id: token.userId, comment: 'Undo of Completed' });
      } else if (token.kind === 'postpone') {
        if (t.status !== 'open' || t.due_date !== token.newDate || t.postpone_count !== token.before.postpone_count + 1) throw changed;
        var from = t.due_date;
        Object.assign(t, token.before);
        hist(d, { tool_id: t.tool_id, task_id: t.id, action: 'undone', user_id: token.userId, comment: 'Undo of Postponed', old_date: from, new_date: t.due_date });
      } else throw err('invalid', 'Nothing to undo.');
      return t;
    }, 'undo');
  }

  /* --- Admin session ------------------------------------------------ */

  function adminLogin(operatorId, pin) {
    return load().then(function (d) {
      if (!d) throw err('nofile', 'No plan file.');
      var u = findUser(d, operatorId);
      if (!u || !u.active || u.role !== 'admin') throw err('badlogin', 'Wrong name or PIN.');
      return verifyPin(pin, u.pin_hash).then(function (ok) {
        if (!ok) throw err('badlogin', 'Wrong name or PIN.');
        admin = { user_id: u.id };
        return u;
      });
    });
  }
  /** Restore a session (same tab after reload) without the PIN. */
  function resumeAdmin(userId) {
    var u = data && find(data.users, userId);
    if (u && u.active && u.role === 'admin') { admin = { user_id: userId }; return u; }
    admin = null; return null;
  }
  function adminLogout() { admin = null; }
  function currentAdmin() {
    if (!admin || !data) return null;
    var u = find(data.users, admin.user_id);
    return u && u.active && u.role === 'admin' ? u : null;
  }

  /* --- Admin: tasks ------------------------------------------------- */

  /** R8 */
  function reopen(taskId) {
    return mutate(function (d) {
      var a = requireAdmin(d);
      var t = find(d.tasks, taskId);
      if (!t || t.status !== 'completed') throw err('conflict', 'This cleaning is not completed.');
      var latest = d.tasks.filter(function (x) { return x.tool_id === t.tool_id && x.status === 'completed'; })
        .sort(function (x, y) { return x.completed_at < y.completed_at ? 1 : -1; })[0];
      if (latest.id !== t.id) throw err('notlatest', 'Only the most recent completed cleaning of a tool can be reopened.');
      var gen = d.tasks.find(function (x) { return x.generated_from === t.id && x.status === 'open' && !x.postpone_count; });
      if (gen) removeGenerated(d, gen);
      var by = t.completed_by;
      t.status = 'open'; t.completed_by = null; t.completed_at = null; t.completion_comment = '';
      hist(d, { tool_id: t.tool_id, task_id: t.id, action: 'reopened', user_id: a.id, comment: 'Was completed by ' + userName(d, by) });
      return t;
    }, 'admin');
  }

  /** R10 edit: move an open cleaning to another working day. */
  function editTask(taskId, newDate) {
    return mutate(function (d) {
      var a = requireAdmin(d);
      var t = openTaskOrThrow(d, taskId);
      if (!R.isDate(newDate)) throw err('baddate', 'Enter a valid date.');
      if (R.isWeekend(newDate)) throw err('baddate', 'Choose a working day (Monday to Friday).');
      var old = t.due_date;
      t.due_date = newDate;
      hist(d, { tool_id: t.tool_id, task_id: t.id, action: 'task_edited', user_id: a.id, old_date: old, new_date: newDate });
      return t;
    }, 'admin');
  }

  /** R10 delete: open cleanings only; the schedule continues. */
  function deleteTask(taskId) {
    return mutate(function (d) {
      var a = requireAdmin(d);
      var t = openTaskOrThrow(d, taskId);
      d.tasks.splice(d.tasks.indexOf(t), 1);
      hist(d, { tool_id: t.tool_id, task_id: t.id, action: 'task_deleted', user_id: a.id, old_date: t.due_date });
      var tool = find(d.tools, t.tool_id);
      var next = null;
      if (!t.is_one_off && tool && !tool.archived && R.hasSchedule(tool)) next = ensureNext(d, tool, t, R.addDays(R.today(), -1));
      return { next: next };
    }, 'admin');
  }

  /** R9 */
  function addOneOff(toolId, date, comment) {
    return mutate(function (d) {
      var a = requireAdmin(d);
      var tool = find(d.tools, toolId);
      if (!tool || tool.archived) throw err('notfound', 'Choose a tool.');
      if (!R.isDate(date)) throw err('baddate', 'Enter a valid date.');
      if (R.isWeekend(date)) throw err('baddate', 'Choose a working day (Monday to Friday).');
      if (date < R.today()) throw err('baddate', 'The date cannot be in the past.');
      var t = makeTask(tool.id, { pattern: date }, true);
      d.tasks.push(t);
      hist(d, { tool_id: tool.id, task_id: t.id, action: 'task_added', user_id: a.id, new_date: date, comment: comment || 'One-off cleaning' });
      return t;
    }, 'admin');
  }

  /* --- Admin: future cycles (R19) ---------------------------------- */

  /** Check that `nominal` is a real future cycle of the tool (after its open cleaning). */
  function futureCycle(d, tool, nominal) {
    var open = openScheduled(d, tool.id);
    if (!open) throw err('invalid', 'This tool has no open cleaning.');
    var r = { nominal: open.nominal_date || open.pattern_date };
    for (var i = 0; i < 600; i++) {
      r = R.stepRule(tool, r.nominal);
      if (r.nominal === nominal) return { open: open, cycle: r };
      if (r.nominal > nominal) break;
    }
    throw err('invalid', 'This is not a future cycle of ' + tool.name + '.');
  }

  function moveCycle(toolId, nominal, newDate) {
    return mutate(function (d) {
      var a = requireAdmin(d);
      var tool = find(d.tools, toolId);
      if (!tool || tool.archived) throw err('notfound', 'This tool no longer exists.');
      var fc = futureCycle(d, tool, nominal);
      if (!R.isDate(newDate) || R.isWeekend(newDate)) throw err('baddate', 'Choose a working day (Monday to Friday).');
      if (newDate < R.today()) throw err('baddate', 'The date cannot be in the past.');
      if (newDate <= fc.open.due_date) throw err('baddate', 'The new date must be after the open cleaning (' + R.longDate(fc.open.due_date) + ').');
      d.exceptions = (d.exceptions || []).filter(function (e) { return !(e.tool_id === toolId && e.nominal === nominal); });
      if (newDate !== fc.cycle.pattern) d.exceptions.push({ id: newId('ex'), tool_id: toolId, nominal: nominal, action: 'move', new_date: newDate });
      hist(d, { tool_id: toolId, action: 'cycle_moved', user_id: a.id, old_date: fc.cycle.pattern, new_date: newDate, comment: 'Future cycle moved' });
      return { from: fc.cycle.pattern, to: newDate };
    }, 'admin');
  }

  function skipCycle(toolId, nominal, reason) {
    return mutate(function (d) {
      var a = requireAdmin(d);
      var tool = find(d.tools, toolId);
      if (!tool || tool.archived) throw err('notfound', 'This tool no longer exists.');
      var fc = futureCycle(d, tool, nominal);
      d.exceptions = (d.exceptions || []).filter(function (e) { return !(e.tool_id === toolId && e.nominal === nominal); });
      d.exceptions.push({ id: newId('ex'), tool_id: toolId, nominal: nominal, action: 'skip', new_date: null });
      hist(d, { tool_id: toolId, action: 'cycle_skipped', user_id: a.id, old_date: fc.cycle.pattern, reason: reason });
      return fc.cycle.pattern;
    }, 'admin');
  }

  /** Undo a move or skip of a future cycle: back to the normal schedule date. */
  function restoreCycle(toolId, nominal) {
    return mutate(function (d) {
      var a = requireAdmin(d);
      var before = (d.exceptions || []).length;
      d.exceptions = (d.exceptions || []).filter(function (e) { return !(e.tool_id === toolId && e.nominal === nominal); });
      if (d.exceptions.length === before) throw err('conflict', 'Nothing to restore: this cycle is already on its normal date.');
      hist(d, { tool_id: toolId, action: 'cycle_restored', user_id: a.id, new_date: R.toWorkingDay(nominal), comment: 'Back to the normal schedule' });
      return true;
    }, 'admin');
  }

  /* --- Admin: tools ------------------------------------------------- */

  var TOOL_FIELDS = ['name', 'tool_owner', 'mnt_owner', 'schedule_type', 'interval', 'weekday', 'month_day', 'start_date', 'status'];

  function normalizeTool(input) {
    var t = {
      name: clean(input.name).toUpperCase(),
      tool_owner: clean(input.tool_owner),
      mnt_owner: clean(input.mnt_owner),
      schedule_type: input.schedule_type === 'months' ? 'months' : input.schedule_type === 'none' ? 'none' : 'weeks',
      interval: parseInt(input.interval, 10),
      weekday: input.weekday == null || input.weekday === '' ? null : parseInt(input.weekday, 10),
      month_day: input.month_day == null || input.month_day === '' ? null : parseInt(input.month_day, 10),
      start_date: clean(input.start_date)
    };
    if (t.schedule_type === 'weeks') t.month_day = null; else t.weekday = null;
    if (t.schedule_type === 'none') { t.interval = null; t.start_date = ''; }
    if (isNaN(t.interval)) t.interval = null;
    return t;
  }

  function validateTool(d, t, id) {
    if (!t.name) return 'Enter the tool name.';
    if (t.name.length > 40) return 'The tool name is too long.';
    var dup = d.tools.find(function (x) { return x.id !== id && R.ofKind(x, t.kind) && x.name.toUpperCase() === t.name; });
    if (dup) return 'A tool named "' + t.name + '" already exists' + (dup.archived ? ' (archived).' : '.');
    if (t.kind === 'pm' && (t.schedule_type === 'none' || !t.start_date)) {
      // PM tools may have no PM, or no start date yet (13e)
      if (t.schedule_type !== 'none' && t.interval != null && !(t.interval >= 1 && t.interval <= 52)) return 'Repeat every: enter a whole number from 1 to 52.';
      return '';
    }
    return R.validateSchedule(t);
  }

  /** Add (no id) or edit a tool. R3 / R11. */
  function saveTool(input) {
    return mutate(function (d) {
      var a = requireAdmin(d);
      var t = normalizeTool(input);
      var existing = input.id ? find(d.tools, input.id) : null;
      t.kind = existing ? (R.isPm(existing) ? 'pm' : undefined) : (input.kind === 'pm' ? 'pm' : undefined);
      // installed / not installed (PM tools); a down tool stays down
      var cur = existing ? existing.status : 'active';
      t.status = input.planned ? 'planned' : (cur === 'planned' ? 'active' : cur);
      var msg = validateTool(d, t, input.id);
      if (msg) throw err('invalid', msg);

      if (!input.id) {
        var tool = Object.assign({ id: newId('tool'), down_reason: '', down_since: null, down_from: null, down_until: null, archived: false }, t);
        if (!tool.kind) delete tool.kind;
        d.tools.push(tool);
        if (R.hasSchedule(tool)) d.tasks.push(makeTask(tool.id, tool.kind === 'pm' ? firstFrom(tool) : R.firstRuleDate(tool, tool.start_date)));
        hist(d, { tool_id: tool.id, action: 'tool_changed', user_id: a.id, comment: 'Tool added: ' + R.describeSchedule(tool) });
        return tool;
      }

      var old = existing;
      if (!old) throw err('notfound', 'This tool no longer exists.');
      if (!t.kind) delete t.kind;
      var changes = TOOL_FIELDS.filter(function (f) { return String(old[f]) !== String(t[f]); });
      if (!changes.length) return old;
      var scheduleChanged = changes.some(function (f) { return ['schedule_type', 'interval', 'weekday', 'month_day', 'start_date', 'status'].indexOf(f) >= 0; });
      var before = R.describeSchedule(old);
      Object.assign(old, t);
      if (old.status === 'planned') { old.down_reason = ''; old.down_since = null; old.down_from = null; old.down_until = null; }
      if (scheduleChanged) d.exceptions = (d.exceptions || []).filter(function (e) { return e.tool_id !== old.id; });
      if (scheduleChanged && !R.hasSchedule(old)) {
        // no PM any more (not installed / no schedule): drop the open scheduled task
        var gone = openScheduled(d, old.id);
        if (gone) d.tasks.splice(d.tasks.indexOf(gone), 1);
      } else if (scheduleChanged && old.status !== 'down') {
        var open = openScheduled(d, old.id);
        if (open) {
          // R11: realign from the old pattern date (or the new start date when it changed)
          var anchor = changes.indexOf('start_date') >= 0 ? old.start_date : open.pattern_date;
          var r = R.firstRuleDate(old, anchor);
          open.pattern_date = r.pattern; open.nominal_date = r.nominal; open.due_date = r.pattern;
          open.postpone_count = 0; open.last_postpone_reason = '';
        } else {
          d.tasks.push(makeTask(old.id, R.isPm(old) ? firstFrom(old) : R.firstRuleDate(old, R.maxDate(old.start_date, R.today()))));
        }
      }
      hist(d, { tool_id: old.id, action: 'tool_changed', user_id: a.id,
        comment: 'Changed: ' + changes.join(', ') + (scheduleChanged ? ' (' + before + ' -> ' + R.describeSchedule(old) + ')' : '') });
      return old;
    }, 'admin');
  }

  /** R12 */
  function archiveTool(toolId, archived) {
    return mutate(function (d) {
      var a = requireAdmin(d);
      var tool = find(d.tools, toolId);
      if (!tool) throw err('notfound', 'This tool no longer exists.');
      tool.archived = !!archived;
      if (!archived && tool.status !== 'down' && R.hasSchedule(tool) && !openScheduled(d, tool.id)) {
        d.tasks.push(makeTask(tool.id, R.firstRuleDate(tool, R.maxDate(tool.start_date, R.today()))));
      }
      hist(d, { tool_id: tool.id, action: 'tool_changed', user_id: a.id, comment: archived ? 'Tool archived' : 'Tool restored' });
      return tool;
    }, 'admin');
  }

  /** R7 */
  /** R7. PM tools (13e): optional from / until dates (from defaults to today). */
  function toolDown(toolId, reason, from, until) {
    return mutate(function (d) {
      var a = requireAdmin(d);
      var tool = find(d.tools, toolId);
      if (!tool) throw err('notfound', 'This tool no longer exists.');
      if (tool.status === 'down') throw err('conflict', 'This tool is already down.');
      if (tool.status === 'planned') throw err('conflict', 'This tool is not installed yet.');
      var f = clean(from) || R.today(), u = clean(until) || null;
      if (!R.isDate(f)) throw err('baddate', 'Enter a valid "down from" date.');
      if (u && !R.isDate(u)) throw err('baddate', 'Enter a valid "until" date.');
      if (u && u < f) throw err('baddate', 'The "until" date cannot be before the "from" date.');
      tool.status = 'down'; tool.down_reason = clean(reason); tool.down_since = nowStamp();
      tool.down_from = R.isPm(tool) ? f : null; tool.down_until = R.isPm(tool) ? u : null;
      hist(d, { tool_id: tool.id, action: 'tool_down', user_id: a.id, reason: reason,
        new_date: R.isPm(tool) ? f : null, comment: R.isPm(tool) && u ? 'Down until ' + R.longDate(u) : '' });
      return tool;
    }, 'admin');
  }

  function reactivate(toolId, date) {
    return mutate(function (d) {
      var a = requireAdmin(d);
      var tool = find(d.tools, toolId);
      if (!tool) throw err('notfound', 'This tool no longer exists.');
      if (tool.status !== 'down') throw err('conflict', 'This tool is not down.');
      if (!R.hasSchedule(tool)) {
        tool.status = 'active'; tool.down_reason = ''; tool.down_since = null; tool.down_from = null; tool.down_until = null;
        hist(d, { tool_id: tool.id, action: 'reactivated', user_id: a.id });
        return tool;
      }
      if (!R.isDate(date)) throw err('baddate', 'Choose the date of the next cleaning.');
      if (R.isWeekend(date)) throw err('baddate', 'Choose a working day (Monday to Friday).');
      if (date < R.today()) throw err('baddate', 'The date cannot be in the past.');
      tool.status = 'active'; tool.down_reason = ''; tool.down_since = null; tool.down_from = null; tool.down_until = null;
      var open = openScheduled(d, tool.id);
      if (open) {
        open.pattern_date = date; open.nominal_date = date; open.due_date = date;
        open.postpone_count = 0; open.last_postpone_reason = '';
      } else {
        open = makeTask(tool.id, { pattern: date });
        d.tasks.push(open);
      }
      if (tool.schedule_type === 'months') {
        // keep the monthly pattern: nominal = rule day of that month
        open.nominal_date = R.monthDate(+date.slice(0, 4), +date.slice(5, 7), tool.month_day);
      }
      hist(d, { tool_id: tool.id, task_id: open.id, action: 'reactivated', user_id: a.id, new_date: date });
      return tool;
    }, 'admin');
  }

  /* --- Admin: users and settings ------------------------------------ */

  function saveUser(input) {
    var pin = clean(input.pin);
    var pinStep = pin ? hashPin(pin) : Promise.resolve(null);
    return pinStep.then(function (pinHash) {
      return mutate(function (d) {
        var a = requireAdmin(d);
        var name = clean(input.name);
        var existing = input.id ? find(d.users, input.id) : null;
        var opId = clean(input.operator_id).toUpperCase() || (existing ? existing.operator_id : nextShortId(d));
        var role = input.role === 'admin' ? 'admin' : 'operator';
        var active = input.active !== false;
        if (!name) throw err('invalid', 'Enter the name.');
        if (!/^[A-Z0-9_-]{2,20}$/.test(opId)) throw err('invalid', 'Short ID: 2 to 20 letters, digits, - or _.');
        var sameName = d.users.find(function (x) { return x.id !== input.id && x.name.toLowerCase() === name.toLowerCase(); });
        if (sameName) throw err('invalid', '"' + name + '" is already in the list. Use a different name (e.g. add the first letter of the surname).');
        var dup = d.users.find(function (x) { return x.id !== input.id && x.operator_id.toUpperCase() === opId; });
        if (dup) throw err('invalid', 'Short ID "' + opId + '" is already used by ' + dup.name + '.');
        var u = input.id ? find(d.users, input.id) : null;
        if (input.id && !u) throw err('notfound', 'This user no longer exists.');
        var hasPin = pinHash || (u && u.pin_hash);
        if (role === 'admin' && !hasPin) throw err('invalid', 'An Admin needs a PIN.');
        if (u && u.role === 'admin' && u.active && (role !== 'admin' || !active)) {
          var others = d.users.filter(function (x) { return x.id !== u.id && x.role === 'admin' && x.active; });
          if (!others.length) throw err('invalid', 'There must always be at least one active Admin.');
        }
        if (!u) { u = { id: newId('user'), pin_hash: null }; d.users.push(u); }
        u.operator_id = opId; u.name = name; u.role = role; u.active = active;
        if (pinHash) u.pin_hash = pinHash;
        if (role !== 'admin') u.pin_hash = null;
        hist(d, { action: 'user_changed', user_id: a.id, comment: (input.id ? 'User changed: ' : 'User added: ') + opId + ' (' + name + ', ' + role + (active ? '' : ', inactive') + ')' });
        return u;
      }, 'admin');
    });
  }

  function saveSettings(input) {
    return mutate(function (d) {
      requireAdmin(d);
      var url = clean(input.teams_webhook_url);
      if (url && !/^https:\/\//i.test(url)) throw err('invalid', 'The Teams webhook URL must start with https://');
      d.settings.teams_webhook_url = url;
      d.settings.theme_default = input.theme_default === 'teal' ? 'teal' : 'white';
      return d.settings;
    }, 'admin');
  }

  /** Adds any of the standard operators that are missing (by name). For plans created before the list existed. */
  function addStandardOperators() {
    return mutate(function (d) {
      var a = requireAdmin(d);
      var added = [];
      SEED_OPERATORS.forEach(function (n) {
        if (d.users.some(function (u) { return u.name.toLowerCase() === n.toLowerCase(); })) return;
        d.users.push({ id: newId('user'), operator_id: nextShortId(d), name: n, role: 'operator', pin_hash: null, active: true });
        added.push(n);
      });
      if (added.length) hist(d, { action: 'user_changed', user_id: a.id, comment: 'Standard operators added: ' + added.join(', ') });
      return added;
    }, 'admin');
  }

  /** Adds the PM tools from the Excel that are missing (for plans created before the PM tab). */
  function addPmTools() {
    return mutate(function (d) {
      var a = requireAdmin(d);
      var added = seedPm(d);
      if (added.length) hist(d, { action: 'tool_changed', user_id: a.id, comment: 'PM tools added from the Excel: ' + added.join(', ') });
      return added;
    }, 'admin');
  }

  /* --- Magazines (PLAN 13f) ----------------------------------------- */

  function mags(d) { d.magazines = d.magazines || []; d.mag_events = d.mag_events || []; return d.magazines; }
  function yesNo(v) { var s = clean(v); return /^y/i.test(s) ? (/x/i.test(s) ? 'Yes / X' : 'Yes') : /^n/i.test(s) ? 'No' : s; }

  /** Adds the magazines from the Excel that are missing (by S/N), with their last check. -> S/Ns added */
  function seedMagazines(d) {
    mags(d);
    var added = [];
    SEED_MAGAZINES.forEach(function (s, i) {
      if (d.magazines.some(function (m) { return m.sn === s[0]; })) return;
      var m = { id: newId('mag'), sn: s[0], cr_type: s[3], cart: yesNo(s[1]), prod_use: yesNo(s[2]), lot_status: '', location: '',
        last_check: null, last_by: null, last_by_name: '', needs_repair: false, repair_note: '', repair_since: null, pos: i, archived: false };
      d.magazines.push(m);
      if (s[5]) {
        var u = d.users.find(function (x) { return x.name.toLowerCase().indexOf(s[4].toLowerCase()) === 0; });
        applyCheck(d, m, { user: u, by_name: u ? u.name : s[4], date: s[5], at: s[5] + 'T12:00:00', cart: m.cart, prod_use: m.prod_use,
          lot_status: s[6], repair_needed: s[7] === 'y', cleaned: false, comment: s[8] });
      }
      added.push(m.sn);
    });
    return added;
  }

  function applyCheck(d, m, c) {
    var ev = { id: newId('mev'), magazine_id: m.id, kind: 'check', at: c.at, date: c.date, user_id: c.user ? c.user.id : null, by_name: c.by_name,
      cart: c.cart, prod_use: c.prod_use, lot_status: clean(c.lot_status), repair_needed: !!c.repair_needed, cleaned: !!c.cleaned, comment: clean(c.comment) };
    d.mag_events.push(ev);
    m.last_check = c.date; m.last_by = ev.user_id; m.last_by_name = c.by_name;
    m.cart = ev.cart; m.prod_use = ev.prod_use; m.lot_status = ev.lot_status; m.location = ev.comment;
    if (ev.cleaned) m.cleaned_at = c.date;
    if (ev.repair_needed && !m.needs_repair) { m.needs_repair = true; m.repair_since = c.date; }
    if (ev.repair_needed) m.repair_note = ev.comment;
    return ev;
  }

  function magOrThrow(d, id) {
    var m = find(mags(d), id);
    if (!m || m.archived) throw err('conflict', 'This magazine no longer exists. The list will refresh.');
    return m;
  }

  /** Log a check (anyone, chooses their name). input: {cart, prod_use, lot_status, repair_needed, cleaned, comment} */
  function magCheck(magId, operatorId, input) {
    var i = input || {};
    return mutate(function (d) {
      var u = userByOperatorId(d, operatorId);
      var m = magOrThrow(d, magId);
      m.planned_date = null;
      var ev = applyCheck(d, m, { user: u, by_name: u.name, date: R.today(), at: nowStamp(), cart: yesNo(i.cart), prod_use: yesNo(i.prod_use),
        lot_status: i.lot_status, repair_needed: !!i.repair_needed, cleaned: !!i.cleaned, comment: i.comment });
      hist(d, { magazine_id: m.id, action: 'mag_checked', user_id: u.id,
        comment: [ev.repair_needed ? 'Repair needed' : 'OK', ev.cleaned ? 'cleaned' : '', ev.lot_status ? 'lot ' + ev.lot_status : '', ev.comment].filter(Boolean).join(' · ') });
      return { magazine: m, event: ev };
    }, clean(operatorId).toUpperCase());
  }

  /** Plan the next cleaning/check of a magazine on another working day (anyone, with name; drag in the Week plan). */
  function magPlan(magId, operatorId, date, reason) {
    return mutate(function (d) {
      var u = userByOperatorId(d, operatorId);
      var m = magOrThrow(d, magId);
      if (!R.isDate(date)) throw err('baddate', 'Enter a valid date.');
      var target = R.toWorkingDay(date);
      if (target < R.today()) throw err('baddate', 'The date cannot be in the past.');
      var old = R.magDue(m, magCheckWeeksOf(d), R.today());
      m.planned_date = target;
      hist(d, { magazine_id: m.id, action: 'mag_planned', user_id: u.id, reason: reason, old_date: old, new_date: target });
      return { magazine: m, date: target };
    }, clean(operatorId).toUpperCase());
  }
  function magCheckWeeksOf(d) { var w = d.settings && d.settings.mag_check_weeks; return w == null ? 4 : w; }

  function magWeek(weekDate) {
    return R.buildMagWeek(magazines(false), (data && data.mag_events) || [], weekDate, R.today(), magCheckWeeks());
  }

  /** Repair finished (anyone, chooses their name). */
  function magRepairDone(magId, operatorId, comment) {
    return mutate(function (d) {
      var u = userByOperatorId(d, operatorId);
      var m = magOrThrow(d, magId);
      if (!m.needs_repair) throw err('conflict', 'This magazine has no open repair. The list will refresh.');
      d.mag_events.push({ id: newId('mev'), magazine_id: m.id, kind: 'repair_done', at: nowStamp(), date: R.today(), user_id: u.id, by_name: u.name,
        comment: clean(comment), repair_note: m.repair_note, repair_since: m.repair_since });
      hist(d, { magazine_id: m.id, action: 'mag_repaired', user_id: u.id, reason: m.repair_note, comment: comment, old_date: m.repair_since });
      m.needs_repair = false; m.repair_note = ''; m.repair_since = null;
      return m;
    }, clean(operatorId).toUpperCase());
  }

  /** Admin: add (no id) or edit a magazine. */
  function saveMagazine(input) {
    return mutate(function (d) {
      var a = requireAdmin(d);
      mags(d);
      var sn = clean(input.sn).toUpperCase(), cr = clean(input.cr_type).toUpperCase();
      if (!sn) throw err('invalid', 'Enter the magazine S/N.');
      if (sn.length > 30) throw err('invalid', 'The S/N is too long.');
      var dup = d.magazines.find(function (m) { return m.id !== input.id && m.sn === sn; });
      if (dup) throw err('invalid', 'Magazine ' + sn + ' already exists' + (dup.archived ? ' (archived).' : '.'));
      var m;
      if (!input.id) {
        m = { id: newId('mag'), sn: sn, cr_type: cr, cart: '', prod_use: '', lot_status: '', location: '', last_check: null, last_by: null, last_by_name: '',
          needs_repair: false, repair_note: '', repair_since: null, pos: null, archived: false };
        d.magazines.push(m);
        hist(d, { magazine_id: m.id, action: 'mag_changed', user_id: a.id, comment: 'Magazine added' + (cr ? ' (' + cr + ')' : '') });
      } else {
        m = find(d.magazines, input.id);
        if (!m) throw err('notfound', 'This magazine no longer exists.');
        var before = m.sn + ' ' + m.cr_type;
        m.sn = sn; m.cr_type = cr;
        if (before !== sn + ' ' + cr) hist(d, { magazine_id: m.id, action: 'mag_changed', user_id: a.id, comment: 'Changed: ' + before + ' -> ' + sn + ' ' + cr });
      }
      return m;
    }, 'admin');
  }

  function archiveMagazine(id, archived) {
    return mutate(function (d) {
      var a = requireAdmin(d);
      var m = find(mags(d), id);

/* js/analytics.js */
/**
 * Hirata Cleaning Plan - analytics.js
 * Pure functions for the cleaning report and the Analytics page.
 * "On time" = done on or before the planned (schedule) date; days late are calendar days.
 */
window.HCP = window.HCP || {};
window.HCP.analytics = (function () {
  'use strict';

  var R = window.HCP.rules;

  function byId(list) { var m = {}; list.forEach(function (x) { m[x.id] = x; }); return m; }

  /** One row per cleaning in [from, to] (by planned date, done date, or still open). */
  /** kind: 'cleaning' (default) or 'pm' (PLAN 13e). */
  function reportRows(data, from, to, today, kind) {
    var tools = byId(data.tools), users = byId(data.users);
    var rows = [];
    data.tasks.forEach(function (t) {
      var tool = tools[t.tool_id];
      if (!tool || !R.ofKind(tool, kind || 'cleaning')) return;
      var doneDate = t.status === 'completed' ? String(t.completed_at).slice(0, 10) : '';
      var planned = t.pattern_date;
      var inRange = function (d) { return d && d >= from && d <= to; };
      var include = inRange(planned) || inRange(doneDate) || (t.status === 'open' && t.due_date <= to && t.due_date <= today && t.due_date >= from);
      if (t.status === 'open' && planned > today && t.due_date > today) include = include && inRange(planned);
      if (!include) return;
      var late = 0, status;
      if (t.status === 'completed') {
        late = Math.max(0, R.diffDays(planned, doneDate));
        status = late ? 'Done late' : 'Done on time';
      } else if (R.downOn(tool, today)) {
        status = 'Tool down';
      } else if (t.due_date < today) {
        late = Math.max(0, R.diffDays(planned, today));
        status = 'Overdue';
      } else {
        status = t.postpone_count ? 'Postponed' : 'Open';
      }
      var u = users[t.completed_by];
      rows.push({
        tool: tool.name, mnt_owner: tool.mnt_owner || '', planned: planned, due: t.due_date, done: doneDate,
        time: t.status === 'completed' ? String(t.completed_at).slice(11, 16) : '',
        days_late: late, who: u ? u.name : '', postponed: t.postpone_count || 0,
        reason: t.last_postpone_reason || '', comment: t.completion_comment || '', status: status,
        one_off: !!t.is_one_off, schedule: t.is_one_off ? 'One-off' : R.describeSchedule(tool)
      });
    });
    return rows.sort(function (a, b) { return a.planned < b.planned ? -1 : a.planned > b.planned ? 1 : a.tool.localeCompare(b.tool); });
  }

  function pct(a, b) { return b ? Math.round(100 * a / b) : null; }

  /** Everything the Analytics page shows, for the period [from, to]. */
  function stats(data, from, to, today) {
    var rows = reportRows(data, from, to, today);
    var done = rows.filter(function (r) { return r.done; });
    var onTime = done.filter(function (r) { return !r.days_late; });
    var lateDays = done.reduce(function (s, r) { return s + r.days_late; }, 0);

    var tools = {};
    rows.forEach(function (r) {
      var t = tools[r.tool] || (tools[r.tool] = { tool: r.tool, total: 0, done: 0, onTime: 0, lateDays: 0, postponed: 0, overdue: 0 });
      t.total++;
      if (r.done) { t.done++; if (!r.days_late) t.onTime++; t.lateDays += r.days_late; }
      if (r.status === 'Overdue') t.overdue++;
      t.postponed += r.postponed;
    });
    var byTool = Object.keys(tools).sort().map(function (k) {
      var t = tools[k];
      t.onTimePct = pct(t.onTime, t.done);
      t.avgLate = t.done ? Math.round(10 * t.lateDays / t.done) / 10 : null;
      return t;
    });

    // weeks: done on time / late per ISO week (by done date)
    var weeks = {};
    for (var m = R.mondayOf(from); m <= to; m = R.addDays(m, 7)) weeks[m] = { monday: m, week: R.isoWeek(m), onTime: 0, late: 0 };
    done.forEach(function (r) { var w = weeks[R.mondayOf(r.done)]; if (w) { if (r.days_late) w.late++; else w.onTime++; } });
    var byWeek = Object.keys(weeks).sort().map(function (k) { return weeks[k]; });

    var ops = {};
    done.forEach(function (r) { var o = ops[r.who || '(unknown)'] || (ops[r.who || '(unknown)'] = { who: r.who || '(unknown)', done: 0, onTime: 0 }); o.done++; if (!r.days_late) o.onTime++; });
    var byOperator = Object.keys(ops).map(function (k) { return ops[k]; }).sort(function (a, b) { return b.done - a.done || a.who.localeCompare(b.who); });

    // postpone reasons from the history (every postponement counts once)
    var reasons = {};
    data.history.forEach(function (h) {
      if (h.action !== 'postponed') return;
      var d = h.at.slice(0, 10);
      if (d < from || d > to) return;
      var key = (h.reason || '').trim();
      var label = key ? key.charAt(0).toUpperCase() + key.slice(1) : '(no reason given)';
      var k = label.toLowerCase();
      (reasons[k] = reasons[k] || { reason: label, count: 0 }).count++;
    });
    var topReasons = Object.keys(reasons).map(function (k) { return reasons[k]; }).sort(function (a, b) { return b.count - a.count; }).slice(0, 8);

    return {
      from: from, to: to, rows: rows,
      kpi: {
        planned: rows.length, done: done.length, onTimePct: pct(onTime.length, done.length),
        avgLate: done.length ? Math.round(10 * lateDays / done.length) / 10 : null,
        postponements: topReasons.reduce(function (s, r) { return s + r.count; }, 0),
        overdueNow: rows.filter(function (r) { return r.status === 'Overdue'; }).length
      },
      byTool: byTool, byWeek: byWeek, byOperator: byOperator, topReasons: topReasons
    };
  }

  /** Period presets -> {from, to} */
  function period(key, today) {
    if (key === 'month') return { from: R.addDays(today, -30), to: today };
    if (key === 'quarter') return { from: R.addDays(today, -91), to: today };
    if (key === 'year') return { from: R.addDays(today, -365), to: today };
    return { from: R.addDays(today, -27), to: today };   // 4 weeks
  }

  return { reportRows: reportRows, stats: stats, period: period };
})();

 *

        tool.status === 'down' ? h('dd', { text: R.longDate(tool.down_since.slice(0, 10)) + (tool.down_reason ? ' – ' + tool.down_reason : '') }) : null,
        h('dt', { text: 'Schedule' }), h('dd', { text: R.describeSchedule(tool) }),
        h('dt', { text: 'Tool owner' }), h('dd', { text: tool.tool_owner || '–' }),

      hist.length ? h('details', { class: 'events' }, [h('summary', { text: 'Recent history' }), h('ul', {}, hist.map(function (r) {

      }))]) : null,

    ]);
    var close = function (msg) { U.toast(msg); m.close(); app.reload(); };

    function menu() {

      U.add(area, h('div', { class: 'actions' }, tool.status === 'down'

        h('div', { class: 'actions' }, [

            var d = date.value;
            if (!R.isDate(d) || R.isWeekend(d) || d < R.today()) { msg.textContent = 'Choose a working day, today or later.'; msg.hidden = false; return; }
            U.confirmStep(area, 'Reactivate ' + tool.name + ' with the next cleaning on ' + R.dayName(d) + ' ' + R.longDate(d) + '?', 'Yes, reactivate', function () {

            }, reactivateForm);
          } }),
          h('button', { class: 'btn ghost', text: 'Cancel', onclick: menu })])]);
    }

  return { render: render, taskPanel: taskPanel, toolPanel: toolPanel };
